name: Bootstrap Android keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Refuse public repositories
        if: github.event.repository.private != true
        run: exit 1
      - name: Generate a signing keystore and credentials
        env:
          KEY_ALIAS: stride
        run: |
          store_password="$(openssl rand -base64 36 | tr -d '\n')"
          key_password="$(openssl rand -base64 36 | tr -d '\n')"
          keytool -genkeypair -keystore stride-release.jks -storetype JKS -storepass "$store_password" -keypass "$key_password" -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=Stride, OU=Personal, O=Stride, L=Private, ST=Private, C=IN'
          {
            printf 'ANDROID_KEYSTORE_BASE64='
            base64 -w 0 stride-release.jks
            printf '\nANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_ALIAS=%s\nANDROID_KEY_PASSWORD=%s\n' "$store_password" "$KEY_ALIAS" "$key_password"
          } > stride-signing-credentials.txt
      - uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4.3.4
        with:
          name: stride-keystore-one-time-download
          path: |
            stride-release.jks
            stride-signing-credentials.txt
          retention-days: 1
